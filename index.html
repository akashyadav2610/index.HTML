<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus - Premium Interactive Media Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600;700;800;900&family=Space+Mono:wght@400;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            --primary: #00d4ff;
            --secondary: #ff006e;
            --dark: #0a0e27;
            --light: #f5f7ff;
            --accent: #7f39fb;
        }

        body {
            font-family: 'Raleway', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #2d1b69 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #fff;
            position: relative;
        }

        /* Animated background with moving gradients */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(0, 212, 255, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(127, 57, 251, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 40% 80%, rgba(255, 0, 110, 0.1) 0%, transparent 50%);
            animation: moveGradient 15s ease infinite;
            z-index: 0;
        }

        @keyframes moveGradient {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-100px, -100px); }
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #mediaCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            display: none;
            background: rgba(10, 14, 39, 0.98);
            backdrop-filter: blur(5px);
        }

        .container {
            text-align: center;
            z-index: 10;
            position: relative;
            animation: slideInDown 1s ease-out;
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4.5em;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #00d4ff 0%, #7f39fb 50%, #ff006e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -2px;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
            animation: glitch 3s ease-in-out infinite;
        }

        @keyframes glitch {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(2px); }
            75% { transform: translateX(-2px); }
        }

        .subtitle {
            font-size: 1.2em;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 2px;
            animation: slideInUp 1s ease-out 0.2s both;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .controls {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 8px 60px rgba(0, 212, 255, 0.15), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.2);
            margin-bottom: 30px;
            border: 1px solid rgba(0, 212, 255, 0.2);
            max-width: 800px;
            animation: slideInUp 1s ease-out 0.4s both;
        }

        .control-section {
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
        }

        .control-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .control-label {
            display: block;
            color: rgba(0, 212, 255, 0.8);
            font-size: 0.95em;
            margin-bottom: 12px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }

        button {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.2), rgba(127, 57, 251, 0.2));
            color: #00d4ff;
            border: 2px solid #00d4ff;
            padding: 12px 25px;
            font-size: 0.95em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-weight: 600;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        button:hover::before {
            left: 100%;
        }

        button:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4);
            border-color: #7f39fb;
            color: #7f39fb;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.3), rgba(127, 57, 251, 0.3));
        }

        button:active {
            transform: translateY(-1px) scale(1.02);
        }

        button.active {
            background: linear-gradient(135deg, #00d4ff, #7f39fb);
            color: #000;
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
        }

        .color-picker-group {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .color-picker-group label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.95em;
        }

        #colorInput {
            width: 70px;
            height: 45px;
            border: 2px solid #00d4ff;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #colorInput:hover {
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
            transform: scale(1.1);
        }

        .video-speed-control {
            margin: 15px 0;
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .video-speed-control label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.95em;
        }

        .video-speed-control input[type="range"] {
            width: 150px;
            cursor: pointer;
            accent-color: #00d4ff;
        }

        .info {
            color: rgba(255, 255, 255, 0.7);
            margin-top: 20px;
            font-size: 1em;
            animation: slideInUp 1s ease-out 0.6s both;
            letter-spacing: 0.5px;
        }

        .status-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9em;
            margin-top: 15px;
            animation: slideInUp 1s ease-out 0.8s both;
        }

        .close-hint {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(0, 212, 255, 0.7);
            font-size: 0.95em;
            text-align: center;
            z-index: 4;
            display: none;
            animation: pulse 2s ease-in-out infinite;
        }

        .close-hint.show {
            display: block;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .hidden-media {
            display: none;
        }

        /* Floating elements */
        .float-element {
            position: fixed;
            pointer-events: none;
            z-index: 0;
        }

        .float-1 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.15), transparent);
            border-radius: 50%;
            top: 10%;
            left: 5%;
            animation: float 8s ease-in-out infinite;
        }

        .float-2 {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(127, 57, 251, 0.15), transparent);
            border-radius: 50%;
            bottom: 15%;
            right: 5%;
            animation: float 10s ease-in-out infinite 2s;
        }

        .float-3 {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(255, 0, 110, 0.1), transparent);
            border-radius: 50%;
            top: 50%;
            right: 10%;
            animation: float 12s ease-in-out infinite 4s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-30px); }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            h1 {
                font-size: 3.5em;
            }
            .controls {
                padding: 30px;
                max-width: 90vw;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5em;
            }
            .subtitle {
                font-size: 1em;
            }
            .controls {
                padding: 20px;
            }
            button {
                padding: 10px 20px;
                font-size: 0.9em;
            }
            .button-group {
                gap: 8px;
            }
        }

        /* Loading animation */
        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #00d4ff;
            border-radius: 50%;
            animation: loading 1.4s infinite;
        }

        @keyframes loading {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- Floating background elements -->
    <div class="float-element float-1"></div>
    <div class="float-element float-2"></div>
    <div class="float-element float-3"></div>

    <canvas id="canvas"></canvas>
    <canvas id="mediaCanvas"></canvas>
    
    <div class="close-hint" id="closeHint">✕ Click anywhere or press ESC to close</div>

    <div class="container">
        <h1>✨ NEXUS ✨</h1>
        <p class="subtitle">Interactive Particle Experience</p>
        
        <div class="controls">
            <!-- Particle Effects -->
            <div class="control-section">
                <label class="control-label">⚛️ Particle Effects</label>
                <div class="button-group">
                    <button onclick="changeColor()">🎨 Random Color</button>
                    <button onclick="clearCanvas()">🗑️ Clear</button>
                    <button onclick="toggleParticles()">✨ Toggle</button>
                </div>
            </div>

            <!-- Sound Controls -->
            <div class="control-section">
                <label class="control-label">🎵 Audio Control</label>
                <div class="button-group">
                    <button id="soundToggle" class="active" onclick="toggleSound()">🔊 Sound On</button>
                </div>
            </div>

            <!-- Color Picker -->
            <div class="control-section">
                <label class="control-label">🎭 Color Customization</label>
                <div class="color-picker-group">
                    <label for="colorInput">Select:</label>
                    <input type="color" id="colorInput" value="#00d4ff">
                </div>
            </div>

            <!-- Random Media Display -->
            <div class="control-section">
                <label class="control-label">📺 Media Gallery</label>
                <div class="button-group">
                    <button onclick="displayRandomImage()">📸 Random Image</button>
                    <button onclick="displayRandomVideo()">🎬 Random Video</button>
                </div>
            </div>

            <!-- Video Speed Control -->
            <div class="video-speed-control" id="speedControl" style="display: none;">
                <label for="videoSpeed">Speed:</label>
                <input type="range" id="videoSpeed" min="0.5" max="3" step="0.5" value="1">
                <span id="speedValue" style="color: #00d4ff; font-weight: 600;">1x</span>
            </div>

            <div class="status-text">
                🎨 Move mouse • Click for burst • 📸 Gallery with one click • 🎵 Interactive sound
            </div>
        </div>
        
        <div class="info">
            💫 Crafted for Excellence • Premium Interactive Media Platform 💫
        </div>
    </div>

    <!-- Hidden media elements -->
    <img id="hiddenImage" class="hidden-media">
    <video id="hiddenVideo" class="hidden-media" playsinline></video>

    <script>
        const canvas = document.getElementById('canvas');
        const mediaCanvas = document.getElementById('mediaCanvas');
        const ctx = canvas.getContext('2d', { alpha: true });
        const mediaCtx = mediaCanvas.getContext('2d');
        const colorInput = document.getElementById('colorInput');
        const soundToggle = document.getElementById('soundToggle');
        const videoSpeed = document.getElementById('videoSpeed');
        const speedValue = document.getElementById('speedValue');
        const speedControl = document.getElementById('speedControl');
        const closeHint = document.getElementById('closeHint');
        const hiddenImage = document.getElementById('hiddenImage');
        const hiddenVideo = document.getElementById('hiddenVideo');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        mediaCanvas.width = window.innerWidth;
        mediaCanvas.height = window.innerHeight;

        let particles = [];
        let currentColor = '#00d4ff';
        let particlesEnabled = true;
        let soundEnabled = true;
        let videoPlaying = false;
        let videoPlaybackSpeed = 1;
        let imageDisplayMode = false;
        let time = 0;

        // Web Audio API setup
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        // Random images from Unsplash
        const randomImages = [
            'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1200&h=800&fit=crop',
            'https://images.unsplash.com/photo-1469022563149-aa64dbd37dae?w=1200&h=800&fit=crop',
            'https://images.unsplash.com/photo-1433633713313-1b82e4696a7e?w=1200&h=800&fit=crop',
            'https://images.unsplash.com/photo-1495616811223-4d98c6e9c869?w=1200&h=800&fit=crop',
            'https://images.unsplash.com/photo-1505142468610-359e7d316be0?w=1200&h=800&fit=crop',
            'https://images.unsplash.com/photo-1501785888041-af3ee9c470a0?w=1200&h=800&fit=crop',
            'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1200&h=800&fit=crop',
        ];

        // Video sources
        const randomVideos = [
            'https://commondatastorage.googleapis.com/gtv-videos-library/sample/BigBuckBunny.mp4',
            'https://commondatastorage.googleapis.com/gtv-videos-library/sample/ElephantsDream.mp4',
            'https://commondatastorage.googleapis.com/gtv-videos-library/sample/ForBiggerBlazes.mp4',
            'https://commondatastorage.googleapis.com/gtv-videos-library/sample/ForBiggerEscapes.mp4',
        ];

        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 6 + 2;
                this.maxSize = this.size;
                this.speedX = (Math.random() - 0.5) * 4;
                this.speedY = (Math.random() - 0.5) * 4;
                this.color = currentColor;
                this.life = 1;
                this.angle = Math.random() * Math.PI * 2;
                this.spin = (Math.random() - 0.5) * 0.2;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.speedX *= 0.98;
                this.speedY *= 0.98;
                this.life -= 0.02;
                this.angle += this.spin;
                this.size = Math.max(0, this.maxSize * Math.max(0, this.life));
            }

            draw() {
                if (this.size <= 0) return;
                
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life * 0.8);
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, Math.max(0.1, this.size), 0, Math.PI * 2);
                ctx.fill();
                
                // Glow effect
                if (this.life > 0.3) {
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = 1;
                    ctx.globalAlpha = this.life * 0.3;
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        function playMeditativeSound(frequency = 440) {
            if (!soundEnabled) return;

            const now = audioContext.currentTime;
            const duration = 0.6;

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            const filter = audioContext.createBiquadFilter();

            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(3000, now);

            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(frequency, now);
            oscillator.frequency.exponentialRampToValueAtTime(frequency * 0.7, now + duration);

            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(0.25, now + 0.08);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration);

            oscillator.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.start(now);
            oscillator.stop(now + duration);
        }

        function playClickSound() {
            if (!soundEnabled) return;

            const now = audioContext.currentTime;
            const duration = 0.4;

            for (let i = 0; i < 4; i++) {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                const filter = audioContext.createBiquadFilter();

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(3500, now);

                const baseFreq = 250 + i * 180;
                oscillator.type = i % 2 === 0 ? 'sine' : 'triangle';
                oscillator.frequency.setValueAtTime(baseFreq, now);
                oscillator.frequency.exponentialRampToValueAtTime(baseFreq * 0.5, now + duration);

                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.15, now + 0.06);
                gainNode.gain.exponentialRampToValueAtTime(0.001, now + duration);

                oscillator.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.start(now);
                oscillator.stop(now + duration);
            }
        }

        function playRandomMeditativeNote() {
            const pentatonicFreqs = [261.63, 293.66, 329.63, 392.00, 440.00, 493.88, 587.33, 659.25, 783.99];
            const frequency = pentatonicFreqs[Math.floor(Math.random() * pentatonicFreqs.length)];
            playMeditativeSound(frequency);
        }

        function handleParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                particles[i].update();
                particles[i].draw();
            }
        }

        function displayRandomImage() {
            const randomImage = randomImages[Math.floor(Math.random() * randomImages.length)];
            displayImage(randomImage);
        }

        function displayRandomVideo() {
            const randomVideo = randomVideos[Math.floor(Math.random() * randomVideos.length)];
            displayVideo(randomVideo);
        }

        function displayImage(imageSrc) {
            imageDisplayMode = true;
            mediaCanvas.style.display = 'block';
            closeHint.classList.add('show');
            speedControl.style.display = 'none';

            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = function() {
                const maxWidth = mediaCanvas.width * 0.9;
                const maxHeight = mediaCanvas.height * 0.9;
                let width = img.width;
                let height = img.height;

                const widthRatio = maxWidth / width;
                const heightRatio = maxHeight / height;
                const ratio = Math.min(widthRatio, heightRatio);

                width *= ratio;
                height *= ratio;

                const x = (mediaCanvas.width - width) / 2;
                const y = (mediaCanvas.height - height) / 2;

                mediaCtx.fillStyle = 'rgba(10, 14, 39, 0.98)';
                mediaCtx.fillRect(0, 0, mediaCanvas.width, mediaCanvas.height);
                
                // Draw frame
                mediaCtx.strokeStyle = 'rgba(0, 212, 255, 0.3)';
                mediaCtx.lineWidth = 2;
                mediaCtx.strokeRect(x - 10, y - 10, width + 20, height + 20);
                
                mediaCtx.drawImage(img, x, y, width, height);
            };
            img.onerror = function() {
                mediaCtx.fillStyle = 'rgba(10, 14, 39, 0.98)';
                mediaCtx.fillRect(0, 0, mediaCanvas.width, mediaCanvas.height);
                mediaCtx.fillStyle = '#00d4ff';
                mediaCtx.font = 'bold 24px Raleway';
                mediaCtx.textAlign = 'center';
                mediaCtx.fillText('Loading image...', mediaCanvas.width / 2, mediaCanvas.height / 2);
            };
            img.src = imageSrc;
        }

        function displayVideo(videoSrc) {
            imageDisplayMode = true;
            mediaCanvas.style.display = 'block';
            closeHint.classList.add('show');
            videoPlaying = true;
            speedControl.style.display = 'flex';

            hiddenVideo.src = videoSrc;
            hiddenVideo.currentTime = 0;
            hiddenVideo.playbackRate = videoPlaybackSpeed;
            
            const playPromise = hiddenVideo.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    mediaCtx.fillStyle = 'rgba(10, 14, 39, 0.98)';
                    mediaCtx.fillRect(0, 0, mediaCanvas.width, mediaCanvas.height);
                    mediaCtx.fillStyle = '#00d4ff';
                    mediaCtx.font = 'bold 24px Raleway';
                    mediaCtx.textAlign = 'center';
                    mediaCtx.fillText('Loading video...', mediaCanvas.width / 2, mediaCanvas.height / 2);
                });
            }

            function drawVideo() {
                if (!videoPlaying) return;

                mediaCtx.fillStyle = 'rgba(10, 14, 39, 0.98)';
                mediaCtx.fillRect(0, 0, mediaCanvas.width, mediaCanvas.height);

                if (hiddenVideo.readyState >= 2) {
                    const maxWidth = mediaCanvas.width * 0.85;
                    const maxHeight = mediaCanvas.height * 0.85;
                    let width = hiddenVideo.videoWidth;
                    let height = hiddenVideo.videoHeight;

                    if (width && height) {
                        const widthRatio = maxWidth / width;
                        const heightRatio = maxHeight / height;
                        const ratio = Math.min(widthRatio, heightRatio);

                        width *= ratio;
                        height *= ratio;

                        const x = (mediaCanvas.width - width) / 2;
                        const y = (mediaCanvas.height - height) / 2;

                        // Draw frame
                        mediaCtx.strokeStyle = 'rgba(0, 212, 255, 0.3)';
                        mediaCtx.lineWidth = 2;
                        mediaCtx.strokeRect(x - 10, y - 10, width + 20, height + 20);
                        
                        mediaCtx.drawImage(hiddenVideo, x, y, width, height);
                    }
                }

                if (!hiddenVideo.ended && videoPlaying) {
                    requestAnimationFrame(drawVideo);
                } else if (hiddenVideo.ended) {
                    closeMedia();
                }
            }

            drawVideo();
        }

        function closeMedia() {
            mediaCanvas.style.display = 'none';
            mediaCtx.clearRect(0, 0, mediaCanvas.width, mediaCanvas.height);
            imageDisplayMode = false;
            videoPlaying = false;
            speedControl.style.display = 'none';
            closeHint.classList.remove('show');
            hiddenVideo.pause();
            hiddenVideo.currentTime = 0;
        }

        videoSpeed.addEventListener('input', function(e) {
            videoPlaybackSpeed = parseFloat(e.target.value);
            speedValue.textContent = videoPlaybackSpeed + 'x';
            if (hiddenVideo.src) {
                hiddenVideo.playbackRate = videoPlaybackSpeed;
            }
        });

        mediaCanvas.addEventListener('click', closeMedia);

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && imageDisplayMode) {
                closeMedia();
            }
        });

        function animate() {
            time++;
            
            if (!imageDisplayMode) {
                // Create gradient trail effect
                ctx.fillStyle = 'rgba(10, 14, 39, 0.1)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                handleParticles();
            }
            requestAnimationFrame(animate);
        }

        canvas.addEventListener('mousemove', (e) => {
            if (particlesEnabled && !imageDisplayMode) {
                for (let i = 0; i < 3; i++) {
                    particles.push(new Particle(e.x + (Math.random() - 0.5) * 20, e.y + (Math.random() - 0.5) * 20));
                }
                if (Math.random() > 0.8) {
                    playRandomMeditativeNote();
                }
            }
        });

        canvas.addEventListener('click', (e) => {
            if (!imageDisplayMode) {
                for (let i = 0; i < 50; i++) {
                    const angle = (i / 50) * Math.PI * 2;
                    const velocity = 5;
                    const particle = new Particle(e.x, e.y);
                    particle.speedX = Math.cos(angle) * velocity;
                    particle.speedY = Math.sin(angle) * velocity;
                    particles.push(particle);
                }
                playClickSound();
            }
        });

        colorInput.addEventListener('input', (e) => {
            currentColor = e.target.value;
        });

        function changeColor() {
            const colors = ['#00d4ff', '#7f39fb', '#ff006e', '#f9ca24', '#6c5ce7', '#a29bfe', '#fd79a8', '#ff1744'];
            currentColor = colors[Math.floor(Math.random() * colors.length)];
            colorInput.value = currentColor;
            playRandomMeditativeNote();
        }

        function clearCanvas() {
            particles = [];
            ctx.fillStyle = 'rgba(10, 14, 39, 1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function toggleParticles() {
            particlesEnabled = !particlesEnabled;
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            soundToggle.textContent = soundEnabled ? '🔊 Sound On' : '🔇 Sound Off';
            soundToggle.classList.toggle('active');
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            mediaCanvas.width = window.innerWidth;
            mediaCanvas.height = window.innerHeight;
        });

        animate();
    </script>
</body>
</html>
